<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIB Smart Navigator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght=500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --accent: #84cc16;
            --sidebar-bg: rgba(255, 255, 255, 0.9);
        }

        body { font-family: 'Space Grotesk', sans-serif; margin: 0; padding: 0; overflow: hidden; background: #f3f4f6; }
        #map { width: 100vw; height: 100vh; position: absolute; z-index: 1; }
        
        #nav-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: var(--sidebar-bg); backdrop-filter: blur(12px);
            padding: 30px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.3);
            width: 330px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        h2 { margin: 0; font-size: 26px; font-weight: 700; color: var(--primary); letter-spacing: -1px; }
        .tagline { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 25px; display: block; }

        .info-card {
            background: #eef2ff; border: 1px solid #c7d2fe;
            color: #3730a3; padding: 12px; border-radius: 12px;
            font-size: 11px; font-weight: 500; margin-bottom: 20px; line-height: 1.4;
        }

        .input-box { margin-bottom: 15px; }
        label { font-size: 11px; font-weight: 700; color: #374151; text-transform: uppercase; margin-bottom: 6px; display: block; }
        input { 
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e5e7eb;
            background: white; color: #1f2937; font-family: inherit; font-size: 13px;
            box-sizing: border-box; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); outline: none; }

        .mode-container { display: flex; gap: 10px; margin: 20px 0; }
        .mode-btn {
            flex: 1; padding: 12px; border-radius: 12px; border: 1px solid #e5e7eb;
            background: white; color: #4b5563; cursor: pointer; transition: 0.3s;
            font-weight: 600; font-size: 12px;
        }
        .mode-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .btn-execute {
            width: 100%; padding: 15px; border-radius: 12px; border: none;
            background: var(--primary); color: white; font-weight: 700;
            font-size: 14px; text-transform: uppercase; cursor: pointer;
            transition: 0.3s; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
        }
        .btn-execute:hover { transform: translateY(-2px); filter: brightness(1.1); }

        #btn-reset {
            width: 100%; background: none; color: #ef4444; border: 1px solid #fecaca;
            padding: 10px; border-radius: 12px; margin-top: 10px; cursor: pointer;
            font-family: inherit; font-size: 12px; font-weight: 500;
        }

        #result-display {
            margin-top: 20px; padding: 15px; border-radius: 15px;
            background: #f8fafc; border: 1px solid #e2e8f0; display: none;
            text-align: center;
        }
        #result-display span { font-size: 28px; font-weight: 700; color: var(--primary); }

        .custom-landmark {
            background: white; border: 2px solid var(--primary); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="nav-panel">
        <h2>UNIB NAV</h2>
        <span class="tagline">Informatics AI Project</span>

        <div class="info-card">
            📍 <b>NAVIGASI AKTIF:</b> Klik ikon gedung pada peta untuk memilih rute aspal yang presisi.
        </div>

        <div class="form-group">
            <div class="input-box">
                <label>Starting Point</label>
                <input type="text" id="input-start" readonly placeholder="Waiting for selection..." />
            </div>

            <div class="input-box">
                <label>Target Goal</label>
                <input type="text" id="input-end" readonly placeholder="Waiting for selection..." />
            </div>
        </div>

        <div class="mode-container">
            <button class="mode-btn active" id="btn-drive" onclick="setMode('drive')">🛵 Vehicle</button>
            <button class="mode-btn" id="btn-walk" onclick="setMode('walk')">🚶 Walking</button>
        </div>

        <button class="btn-execute" id="btn-action" onclick="cariRute()">Execute Path</button>
        <button id="btn-reset" onclick="resetPoints()">Reset Engine</button>
        
        <div id="result-display">
            <div style="font-size: 10px; color: #64748b; text-transform: uppercase;">Total Distance</div>
            <span id="distance-text">0</span> <small style="color: #64748b;">Meters</small>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = L.map('map', {zoomControl: false}).setView([-3.7580, 102.2715], 16);
        L.control.zoom({position: 'bottomright'}).addTo(map);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // DATA KOORDINAT 23 GEDUNG YANG SUDAH DIKALIBRASI PAS DI SISI JALAN UTAMA
        const unibLandmarks = [
            { name: "Gerbang Utama Depan", lat: -3.759976, lng: 102.267067, icon: '🚪' },
            { name: "Lapangan Basket", lat: -3.759409, lng: 102.267373, icon: '🏀' },
            { name: "GOR UNIB", lat: -3.760455, lng: 102.267812, icon: '🏟️' },
            { name: "Fakultas Ekonomi Bisnis", lat: -3.761350, lng: 102.268413, icon: '📈' },
            { name: "Magister Akuntansi", lat: -3.761400, lng: 102.269030, icon: '📊' },
            { name: "Magister Manajemen", lat: -3.761000, lng: 102.269561, icon: '💼' },
            { name: "Gedung K UNIB", lat: -3.760900, lng: 102.269867, icon: '🏫' },
            { name: "Gedung R (UPT Bahasa)", lat: -3.760500, lng: 102.270355, icon: '🔠' },
            { name: "Dekanat Fak. Hukum", lat: -3.760300, lng: 102.268317, icon: '⚖️' },
            { name: "Perpus Hukum", lat: -3.759650, lng: 102.268317, icon: '📖' },
            { name: "Dekanat Pertanian", lat: -3.759300, lng: 102.269138, icon: '🌾' },
            { name: "Gedung A UNIB", lat: -3.758200, lng: 102.267748, icon: '🅰️' },
            { name: "Layanan Terpadu", lat: -3.758350, lng: 102.271847, icon: '🏛️' },
            { name: "Rektorat UNIB", lat: -3.759000, lng: 102.272297, icon: '🏢' },
            { name: "GB 1 UNIB", lat: -3.757600, lng: 102.273735, icon: '🏫' },
            { name: "Danau UNIB", lat: -3.758500, lng: 102.273145, icon: '🌊' },
            { name: "Perpustakaan UNIB", lat: -3.756900, lng: 102.274770, icon: '📚' },
            { name: "Dekanat FMIPA", lat: -3.756200, lng: 102.274824, icon: '🔬' },
            { name: "Dekanat FKIP", lat: -3.757500, lng: 102.275071, icon: '🎓' },
            { name: "GB 5 UNIB", lat: -3.755600, lng: 102.276406, icon: '🏢' },
            { name: "Gedung Serba Guna (GSG)", lat: -3.757850, lng: 102.276562, icon: '🎪' },
            { name: "Dekanat Teknik", lat: -3.758450, lng: 102.276675, icon: '⚙️' },
            { name: "Stadion UNIB", lat: -3.757800, lng: 102.278158, icon: '⚽' }
        ];

        unibLandmarks.forEach(place => {
            let customIcon = L.divIcon({
                className: 'custom-landmark',
                html: place.icon,
                iconSize: [28, 28]
            });

            L.marker([place.lat, place.lng], { icon: customIcon, draggable: false })
             .addTo(map)
             .on('click', function() {
                 handleLocationSelection(place.lat, place.lng, place.name);
             });
        });

        let currentMode = 'drive';
        let routeLayer = null;
        let markerStart = null;
        let markerEnd = null;
        let startCoord = null;
        let endCoord = null;
        let clickStep = 'start';

        function handleLocationSelection(lat, lng, placeName) {
            if(clickStep === 'start') {
                startCoord = [lat, lng];
                if(markerStart) map.removeLayer(markerStart);
                if(routeLayer) map.removeLayer(routeLayer);
                document.getElementById('result-display').style.display = 'none';
                
                markerStart = L.circleMarker([lat, lng], { color: '#4f46e5', radius: 8, fillOpacity: 0.8 }).addTo(map);
                document.getElementById('input-start').value = placeName;
                
                clickStep = 'end';
            } 
            else if (clickStep === 'end') {
                endCoord = [lat, lng];
                if(markerEnd) map.removeLayer(markerEnd);
                
                markerEnd = L.circleMarker([lat, lng], { color: '#ef4444', radius: 8, fillOpacity: 0.8 }).addTo(map);
                document.getElementById('input-end').value = placeName;
                
                clickStep = 'done';
            }
        }

        function resetPoints() {
            startCoord = null;
            endCoord = null;
            clickStep = 'start';
            document.getElementById('input-start').value = "";
            document.getElementById('input-end').value = "";
            document.getElementById('result-display').style.display = 'none';
            if(markerStart) map.removeLayer(markerStart);
            if(markerEnd) map.removeLayer(markerEnd);
            if(routeLayer) map.removeLayer(routeLayer);
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-drive').classList.toggle('active', mode === 'drive');
            document.getElementById('btn-walk').classList.toggle('active', mode === 'walk');
        }

        async function cariRute() {
            if(!startCoord || !endCoord) return alert("Pilih titik awal dan tujuan terlebih dahulu!");
            let btn = document.getElementById('btn-action');
            btn.innerText = "Processing AI...";
            btn.disabled = true;

            try {
                // Menembak alamat backend lokal Flask
                let response = await fetch('http://127.0.0.1:5000/cari_rute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ start: startCoord, end: endCoord, mode: currentMode })
                });
                let result = await response.json();

                if(result.status === 'success') {
                    if(routeLayer) map.removeLayer(routeLayer);
                    routeLayer = L.polyline(result.path, {color: '#4f46e5', weight: 6, opacity: 0.8, lineJoin: 'round'}).addTo(map);
                    map.fitBounds(routeLayer.getBounds(), {padding: [50, 50]});
                    document.getElementById('result-display').style.display = 'block';
                    document.getElementById('distance-text').innerText = result.distance;
                } else {
                    alert(result.message);
                }
            } catch (error) { 
                alert("Gagal terhubung ke backend Flask. Pastikan Python app.py sudah kamu run!"); 
            }
            btn.innerText = "Execute Path";
            btn.disabled = false;
        }
    </script>
</body>
</html>
