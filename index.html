<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIB Smart Navigator (Serverless)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght=500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4f46e5;
            --sidebar-bg: rgba(255, 255, 255, 0.95);
        }

        body { font-family: 'Space Grotesk', sans-serif; margin: 0; padding: 0; overflow: hidden; background: #f3f4f6; }
        #map { width: 100vw; height: 100vh; position: absolute; z-index: 1; }
        
        #nav-panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: var(--sidebar-bg); backdrop-filter: blur(12px);
            padding: 25px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.3);
            width: 310px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        h2 { margin: 0; font-size: 24px; font-weight: 700; color: var(--primary); letter-spacing: -1px; }
        .tagline { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; display: block; }

        .info-card {
            background: #eef2ff; border: 1px solid #c7d2fe;
            color: #3730a3; padding: 12px; border-radius: 12px;
            font-size: 11px; font-weight: 500; margin-bottom: 15px; line-height: 1.4;
        }

        .input-box { margin-bottom: 12px; }
        label { font-size: 11px; font-weight: 700; color: #374151; text-transform: uppercase; margin-bottom: 4px; display: block; }
        input { 
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e5e7eb;
            background: white; color: #1f2937; font-family: inherit; font-size: 13px;
            box-sizing: border-box;
        }

        .mode-container { display: flex; gap: 10px; margin: 15px 0; }
        .mode-btn {
            flex: 1; padding: 10px; border-radius: 12px; border: 1px solid #e5e7eb;
            background: white; color: #4b5563; cursor: pointer; font-weight: 600; font-size: 12px;
        }
        .mode-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .btn-execute {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            background: var(--primary); color: white; font-weight: 700;
            font-size: 13px; text-transform: uppercase; cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }
        .btn-execute:hover { filter: brightness(1.1); }

        #btn-reset {
            width: 100%; background: none; color: #ef4444; border: 1px solid #fecaca;
            padding: 8px; border-radius: 12px; margin-top: 8px; cursor: pointer;
            font-family: inherit; font-size: 12px;
        }

        #result-display {
            margin-top: 15px; padding: 12px; border-radius: 12px;
            background: #f8fafc; border: 1px solid #e2e8f0; display: none;
            text-align: center;
        }
        #result-display span { font-size: 24px; font-weight: 700; color: var(--primary); }

        .custom-landmark {
            background: white; border: 2px solid var(--primary); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); cursor: pointer;
        }

        /* Menyembunyikan panel teks panduan rute bawaan Leaflet agar peta bersih */
        .leaflet-routing-container { display: none !important; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="nav-panel">
        <h2>UNIB NAV</h2>
        <span class="tagline">Pure GitHub Serverless Edition</span>

        <div class="info-card">
            🚀 <b>MURNI CLIENT-SIDE:</b> Klik pada 2 ikon gedung kampus untuk langsung menggambar rute jalan aspal secara instan.
        </div>

        <div class="form-group">
            <div class="input-box">
                <label>Starting Point</label>
                <input type="text" id="input-start" readonly placeholder="Waiting for selection..." />
            </div>

            <div class="input-box">
                <label>Target Goal</label>
                <input type="text" id="input-end" readonly placeholder="Waiting for selection..." />
            </div>
        </div>

        <div class="mode-container">
            <button class="mode-btn active" id="btn-drive" onclick="setMode('driving')">🛵 Vehicle</button>
            <button class="mode-btn" id="btn-walk" onclick="setMode('foot')">🚶 Walking</button>
        </div>

        <button class="btn-execute" id="btn-action" onclick="cariRute()">Execute Path</button>
        <button id="btn-reset" onclick="resetPoints()">Reset Engine</button>
        
        <div id="result-display">
            <div style="font-size: 10px; color: #64748b; text-transform: uppercase;">Total Jarak Lintasan</div>
            <span id="distance-text">0</span> <small style="color: #64748b;">Meter</small>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    
    <script>
        let map = L.map('map', {zoomControl: false}).setView([-3.7580, 102.2715], 16);
        L.control.zoom({position: 'bottomright'}).addTo(map);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // KOORDINAT AKURAT PADA JALUR JALAN KAMPUS UNIB
        const unibLandmarks = [
            { name: "Gerbang Utama Depan", lat: -3.759976, lng: 102.267067, icon: '🚪' },
            { name: "Rektorat UNIB", lat: -3.759259, lng: 102.272297, icon: '🏢' },
            { name: "Perpustakaan UNIB", lat: -3.756770, lng: 102.274770, icon: '📚' },
            { name: "Danau UNIB", lat: -3.758740, lng: 102.273145, icon: '🌊' },
            { name: "Gedung Serba Guna (GSG)", lat: -3.757773, lng: 102.276562, icon: '🎪' },
            { name: "Layanan Terpadu", lat: -3.758146, lng: 102.271847, icon: '🏛️' },
            { name: "Stadion UNIB", lat: -3.757713, lng: 102.278158, icon: '⚽' }, 
            { name: "Lapangan Basket", lat: -3.759409, lng: 102.267373, icon: '🏀' },
            { name: "GOR UNIB", lat: -3.760455, lng: 102.267812, icon: '🏟️' },
            { name: "Fakultas Ekonomi Bisnis", lat: -3.761571, lng: 102.268413, icon: '📈' },
            { name: "Magister Akuntansi", lat: -3.761577, lng: 102.269030, icon: '📊' },
            { name: "Magister Manajemen", lat: -3.761170, lng: 102.269561, icon: '💼' },
            { name: "Dekanat Fak. Hukum", lat: -3.760561, lng: 102.268317, icon: '⚖️' },
            { name: "Perpus Hukum", lat: -3.759805, lng: 102.268317, icon: '📖' },
            { name: "Dekanat Pertanian", lat: -3.759564, lng: 102.269138, icon: '🌾' },
            { name: "Gedung A UNIB", lat: -3.758049, lng: 102.267748, icon: '🅰️' },
            { name: "Dekanat FMIPA", lat: -3.756004, lng: 102.274824, icon: '🔬' },
            { name: "Dekanat FKIP", lat: -3.757648, lng: 102.275071, icon: '🎓' },
            { name: "Dekanat Teknik", lat: -3.758595, lng: 102.276675, icon: '⚙️' },
            { name: "GB 5 UNIB", lat: -3.755421, lng: 102.276406, icon: '🏢' },
            { name: "GB 1 UNIB", lat: -3.757482, lng: 102.273735, icon: '🏫' },
            { name: "Gedung K UNIB", lat: -3.761149, lng: 102.269867, icon: '🏫' },
            { name: "Gedung R (UPT Bahasa)", lat: -3.760704, lng: 102.270355, icon: '🔠' }
        ];

        // Memasang marker lokasi ke peta
        unibLandmarks.forEach(place => {
            let customIcon = L.divIcon({
                className: 'custom-landmark',
                html: place.icon,
                iconSize: [28, 28]
            });

            let marker = L.marker([place.lat, place.lng], { icon: customIcon }).addTo(map);
            marker.on('click', function(e) {
                L.DomEvent.stopPropagation(e);
                handleLocationSelection(marker.getLatLng().lat, marker.getLatLng().lng, place.name);
            });
        });

        let currentMode = 'driving'; // Pilihan profile OSRM: 'driving' atau 'foot'
        let routingControl = null;
        let startCoord = null;
        let endCoord = null;
        let clickStep = 'start';
        let pointMarkers = [];

        function handleLocationSelection(lat, lng, placeName) {
            if(clickStep === 'start') {
                startCoord = L.latLng(lat, lng);
                clearRouteLayer();
                
                let m = L.circleMarker([lat, lng], { color: '#4f46e5', radius: 7, fillOpacity: 0.9 }).addTo(map);
                pointMarkers.push(m);
                document.getElementById('input-start').value = placeName || `Koordinat: ${lat.toFixed(4)}`;
                
                clickStep = 'end';
            } 
            else if (clickStep === 'end') {
                endCoord = L.latLng(lat, lng);
                
                let m = L.circleMarker([lat, lng], { color: '#ef4444', radius: 7, fillOpacity: 0.9 }).addTo(map);
                pointMarkers.push(m);
                document.getElementById('input-end').value = placeName || `Koordinat: ${lat.toFixed(4)}`;
                
                clickStep = 'done';
            }
        }

        // Mengizinkan user mengklik sembarang tempat di area jalan peta
        map.on('click', function(e) { 
            handleLocationSelection(e.latlng.lat, e.latlng.lng); 
        });

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-drive').classList.toggle('active', mode === 'driving');
            document.getElementById('btn-walk').classList.toggle('active', mode === 'foot');
            if (startCoord && endCoord) cariRute(); 
        }

        function clearRouteLayer() {
            if (routingControl) {
                map.removeControl(routingControl);
                routingControl = null;
            }
            pointMarkers.forEach(m => map.removeLayer(m));
            pointMarkers = [];
            document.getElementById('result-display').style.display = 'none';
        }

        function resetPoints() {
            startCoord = null;
            endCoord = null;
            clickStep = 'start';
            document.getElementById('input-start').value = "";
            document.getElementById('input-end').value = "";
            clearRouteLayer();
        }

        // FUNGSI UTAMA GENERATE RUTE JALAN SECARA CLIENT-SIDE (MURNI JAVASCRIPT)
        function cariRute() {
            if(!startCoord || !endCoord) return alert("Pilih titik awal dan tujuan terlebih dahulu!");
            
            if (routingControl) map.removeControl(routingControl);

            // Memanggil API publik router OSRM yang terintegrasi dengan data peta jalan OpenStreetMap
            routingControl = L.Routing.control({
                waypoints: [startCoord, endCoord],
                router: L.Routing.osrmv1({
                    serviceUrl: `https://router.project-osrm.org/route/v1`,
                    profile: currentMode
                }),
                lineOptions: {
                    styles: [{ color: '#4f46e5', opacity: 0.8, weight: 6 }]
                },
                createMarker: function() { return null; } // Menghilangkan marker default routing machine yang jelek
            }).addTo(map);

            // Event handler untuk menangkap data hasil rute jika sukses
            routingControl.on('routesfound', function(e) {
                let routes = e.routes;
                let summary = routes[0].summary;
                
                document.getElementById('result-display').style.display = 'block';
                document.getElementById('distance-text').innerText = Math.round(summary.totalDistance);
            });

            routingControl.on('routingerror', function() {
                alert("Gagal menemukan jalur jalan yang terhubung antara kedua titik tersebut.");
            });
        }
    </script>
</body>
</html>
